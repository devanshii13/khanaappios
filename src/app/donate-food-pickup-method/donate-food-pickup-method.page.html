<app-captcha></app-captcha>

<ion-content class="pickup-content">

  <div class="hero-section">
    <h2 class="hero-title">How should the food<br>be collected?</h2>
    <p class="hero-subtitle">Choose a pickup method that works best for you</p>
  </div>

  <div class="options-container">

    <!-- Donee Option Card -->
    <div class="option-card" (click)="selectOption('donee')">
      <div class="icon-avatar donee-avatar">
        <ion-icon name="person" class="donee-icon"></ion-icon>
      </div>
      <div class="card-text">
        <div class="card-title">Pickup by Donee</div>
        <div class="card-desc">The donee will come and collect the food from you directly</div>
      </div>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>

    <!-- Khanaa Option Card -->
    <div class="option-card" (click)="selectOption('khanaa')">
      <div class="icon-avatar khanaa-avatar">
        <svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#0d8a72">
          <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-5 10.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm-9 0c-.83 0-1.5-.67-1.5-1.5S5.17 16.5 6 16.5s1.5.67 1.5 1.5S6.83 18.5 6 18.5zm13.5-9l1.96 2.5H17V9.5h2.5z"/>
        </svg>
      </div>
      <div class="card-text">
        <div class="card-title-row">
          <span class="card-title">Pickup by Khanaa</span>
          <span class="new-badge">NEW</span>
        </div>
        <div class="card-desc">Our delivery partner will collect and deliver on your behalf</div>
      </div>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>

  </div>

  <div class="info-chip">
    <ion-icon name="shield-checkmark-outline"></ion-icon>
    <span>Your food is safe with us</span>
  </div>

</ion-content>
<app-footer [currentRoute]="'/donate-food-pickup-method'"></app-footer>
